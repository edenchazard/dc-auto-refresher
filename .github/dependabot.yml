version: 2
updates:
  - package-ecosystem: docker-compose
    directory: '/'
    schedule:
      interval: weekly
      day: saturday
      time: '08:00'
      timezone: Europe/London
    labels:
      - dependencies
      - docker-compose

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
      day: saturday
      time: '08:00'
      timezone: Europe/London
    labels:
      - dependencies
      - docker

  - package-ecosystem: npm
    directory: '/'
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
      day: saturday
      time: '08:00'
      timezone: Europe/London
    labels:
      - dependencies
      - npm
    groups:
      fontawesome:
        patterns:
          - "@fortawesome/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      eslint:
        patterns:
          - "*eslint*"
      css:
        patterns:
          - "tailwindcss"
          - "postcss"
          - "@tailwindcss/postcss"

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: saturday
      time: '08:00'
      timezone: Europe/London
    labels:
      - dependencies
      - actions
