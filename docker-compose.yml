services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    command: npm run dev
    volumes:
      - .:/src
      - node_modules:/src/node_modules
    ports:
      - 3000:3000
    environment:
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
      - NEXT_PUBLIC_POST_MESSAGE_ORIGIN=${NEXT_PUBLIC_POST_MESSAGE_ORIGIN}
      - API_KEY=${API_KEY}
    networks:
      - internal

  testapp:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
      args:
        TESTING: 'true'
    command: sh -c "tail -f /dev/null"
    volumes:
      - .:/src
      - node_modules:/src/node_modules
    environment:
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
      - NEXT_PUBLIC_POST_MESSAGE_ORIGIN=${NEXT_PUBLIC_POST_MESSAGE_ORIGIN}
      - API_KEY=${API_KEY}
    networks:
      - test

volumes:
  node_modules:

networks:
  internal:
  test:
