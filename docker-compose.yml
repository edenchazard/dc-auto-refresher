services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    command: npm run dev
    env_file:
      - .env
    environment:
      BASE_URL: ${BASE_URL:-/}
    ports:
      - 3000:3000
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  testapp:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
      args:
        TESTING: 'true'
    profiles:
      - test
    command: sh -c "tail -f /dev/null"
    env_file:
      - .env
    environment:
      BASE_URL: ${BASE_URL:-/}
      CI: 'true'
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
