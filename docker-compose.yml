services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    command: npm run dev
    env_file:
      - .env
    environment:
      BASE_URL: ${BASE_URL}
    ports:
      - 4321:4321
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    networks:
      - internal

  testapp:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
      args:
        TESTING: 'true'
    profiles:
      - test
    command: sh -c "tail -f /dev/null"
    env_file:
      - .env
    environment:
      BASE_URL: ${BASE_URL}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    networks:
      - test

volumes:
  node_modules:
networks:
  internal:
  test:
